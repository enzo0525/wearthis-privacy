# Supabase free-tier projects pause after 7 days with no activity, which once
# cost Wear This an App Review rejection. One authenticated request a day keeps
# yoqmoibdpjluqssktihc awake. Delete this if the project moves to a paid plan.
name: supabase-keepalive

on:
  schedule:
    - cron: "17 9 * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping the project
        run: |
          code=$(curl -s -o /dev/null -w '%{http_code}' \
            -H "apikey: ${{ secrets.SUPABASE_ANON_KEY }}" \
            "https://yoqmoibdpjluqssktihc.supabase.co/rest/v1/")
          echo "rest/v1 -> $code"
          [ "$code" = "200" ] || exit 1
